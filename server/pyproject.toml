[project]
name = "megamind"
version = "0.1.0"
description = "Megamind server: ingest, memory store and agent for Quest 3 egocentric memory"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "pillow>=10.3",
  "numpy>=1.26",
  "python-ulid>=2.7",
  "anthropic>=0.40",
  "openai>=1.50",
  "lancedb>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "httpx>=0.27"]
tools = ["opencv-python-headless>=4.9", "httpx>=0.27"]
# moment replay: bundled ffmpeg binary, only needed when ffmpeg is not on PATH
replay = ["imageio-ffmpeg>=0.5"]
privacy = ["opencv-python-headless>=4.9,<5"]  # PRIVACY_BLUR_FACES face detection (Haar cascade)
# CPU torch: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu (PyPI torchvision is CUDA)
# ambient audio with local Whisper (AUDIO_STT_PROVIDER=faster-whisper); also needs ffmpeg on PATH
local-stt = ["faster-whisper>=1.0"]
local-embeddings = ["open-clip-torch>=2.24", "sentence-transformers>=3.0", "transformers", "sentencepiece", "protobuf"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["megamind*"]

[tool.setuptools.package-data]
megamind = ["ui/*.html"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "B905"]
